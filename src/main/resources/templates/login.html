
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Classroom | Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            margin: 0;
            background: #f1f5f9;
            color: #172033;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            width: 100%;
            padding: 35px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
        }

        .login-brand {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            color: #172033;
            margin-bottom: 8px;
        }

        .login-brand span {
            color: #4f46e5;
        }

        .login-subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
        }

        .login-card label {
            display: block;
            margin: 17px 0 8px;
            font-weight: 600;
            color: #172033;
        }

        .login-card input {
            display: block;
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #ffffff;
            color: #172033;
            font-size: 14px;
            outline: none;
        }

        .login-card input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .login-card input::placeholder {
            color: #94a3b8;
        }

        .login-submit {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #4f46e5;
            color: #ffffff;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .login-submit:hover {
            background: #4338ca;
        }

        .login-message {
            text-align: center;
            margin-top: 16px;
            padding: 10px;
            border-radius: 8px;
            color: #dc2626;
            background: #fee2e2;
        }

        .login-logout-message {
            color: #059669;
            background: #d1fae5;
        }

        .register-link {
            text-align: center;
            margin-top: 23px;
            color: #64748b;
        }

        .register-link a {
            color: #4f46e5;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1 class="login-brand">
                Smart<span>Classroom</span>
            </h1>

            <p class="login-subtitle">
                Sign in to your account
            </p>

            <!-- Spring Security login form -->
            <form th:action="@{/login}" method="post">

                <label for="username">Email Address</label>

                <input
                    type="email"
                    id="username"
                    name="username"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required>

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

                <button type="submit" class="login-submit">
                    Login
                </button>

            </form>

            <!-- Invalid login message -->
            <p class="login-message" th:if="${param.error}">
                Invalid email or password.
            </p>

            <!-- Successful logout message -->
            <p class="login-message login-logout-message"
               th:if="${param.logout}">
                You have logged out successfully.
            </p>

            <p class="register-link">
                Don't have an account?
                <a th:href="@{/register}">Register here</a>
            </p>

        </div>

    </div>

</body>
</html>
