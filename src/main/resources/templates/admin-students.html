
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Students | Smart Classroom</title>

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/role-ui.css}">
</head>

<body>

<div class="dashboard-layout">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar('ADMIN')}"></div>

    <main class="main-content role-ui admin-ui">

        <!-- Topbar -->
        <div th:replace="~{fragments/topbar :: topbar(
            'Manage Students',
            'Create and manage student accounts'
        )}"></div>

        <div class="page-content">

            <!-- Page heading -->
            <div class="page-header">
                <h1>Student Management</h1>
                <p>Manage student accounts, grades and sections.</p>
            </div>

            <!-- Success message -->
            <div class="alert alert-success"
                 th:if="${success}"
                 th:text="${success}">
            </div>

            <!-- Error message -->
            <div class="alert alert-error"
                 th:if="${error}"
                 th:text="${error}">
            </div>

            <!-- Create student form -->
            <section class="card">

                <h2>Create Student Account</h2>

                <form th:action="@{/admin/students/create}"
                      method="post"
                      class="form-grid">

                    <div class="form-group">
                        <label>Student Full Name</label>
                        <input type="text"
                               name="fullName"
                               placeholder="Enter student name"
                               required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email"
                               name="email"
                               placeholder="Enter student email"
                               required>
                    </div>

                    <div class="form-group">
                        <label>Initial Password</label>
                        <input type="password"
                               name="password"
                               placeholder="Create initial password"
                               minlength="8"
                               required>
                    </div>

                    <div class="form-group">
                        <label>Grade</label>
                        <select name="grade" required>
                            <option value="">Select Grade</option>
                            <option value="1">Grade 1</option>
                            <option value="2">Grade 2</option>
                            <option value="3">Grade 3</option>
                            <option value="4">Grade 4</option>
                            <option value="5">Grade 5</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Section</label>
                        <input type="text"
                               name="section"
                               placeholder="Example: A"
                               maxlength="20"
                               required>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">
                            Create Student
                        </button>
                    </div>

                </form>

            </section>

            <!-- Student list -->
            <section class="card">

                <h2>All Students</h2>

                <div class="table-container">

                    <table>

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Student Name</th>
                                <th>Email</th>
                                <th>Grade</th>
                                <th>Section</th>
                                <th>Update Class</th>
                                <th>Reset Password</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="student : ${students}">

                                <td th:text="${student.id}"></td>

                                <td th:text="${student.fullName}"></td>

                                <td th:text="${student.email}"></td>

                                <td th:text="${student.grade}"></td>

                                <td th:text="${student.section}"></td>

                                <!-- Update grade and section -->
                                <td>

                                    <form th:action="@{/admin/students/{id}/update-class(id=${student.id})}"
                                          method="post">

                                        <select name="grade" required>
                                            <option value="1"
                                                th:selected="${student.grade == 1}">
                                                Grade 1
                                            </option>

                                            <option value="2"
                                                th:selected="${student.grade == 2}">
                                                Grade 2
                                            </option>

                                            <option value="3"
                                                th:selected="${student.grade == 3}">
                                                Grade 3
                                            </option>

                                            <option value="4"
                                                th:selected="${student.grade == 4}">
                                                Grade 4
                                            </option>

                                            <option value="5"
                                                th:selected="${student.grade == 5}">
                                                Grade 5
                                            </option>
                                        </select>

                                        <input type="text"
                                               name="section"
                                               th:value="${student.section}"
                                               maxlength="20"
                                               placeholder="Section"
                                               required>

                                        <button type="submit"
                                                class="btn btn-primary">
                                            Update
                                        </button>

                                    </form>

                                </td>

                                <!-- Reset student password -->
                                <td>

                                    <form th:action="@{/admin/students/{id}/reset-password(id=${student.id})}"
                                          method="post">

                                        <input type="password"
                                               name="newPassword"
                                               placeholder="New password"
                                               minlength="8"
                                               required>

                                        <button type="submit"
                                                class="btn btn-secondary">
                                            Reset
                                        </button>

                                    </form>

                                </td>

                            </tr>

                            <!-- Empty state -->
                            <tr th:if="${#lists.isEmpty(students)}">
                                <td colspan="7">
                                    No student accounts found.
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </div>

    </main>

</div>

</body>
</html>
